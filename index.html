<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tzach.org | Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            text-align: center;
        }

        .container {
            padding: 2rem;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            color: #2d3436;
        }

        p {
            font-size: 1.1rem;
            color: #636e72;
            margin-bottom: 2rem;
        }

        .contact-box {
            border-top: 1px solid #dfe6e9;
            padding-top: 1.5rem;
        }

        .email-link {
            display: inline-block;
            text-decoration: none;
            color: #0984e3;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .email-link:hover {
            color: #74b9ff;
        }

        .status-tag {
            display: inline-block;
            background: #dfe6e9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-tag">Coming Soon</div>
        <h1>Tzach.org</h1>
        <p>Something new is in the works. We are currently preparing our digital home.</p>
        
        <div class="contact-box">
            <p>In the meantime, feel free to reach out to shebo (webmaster):</p>
            <a href="mailto:info@tzach.org" class="email-link">info@tzach.org</a>
        </div>
    </div>

</body>
</html>
